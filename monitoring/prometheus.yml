global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # ZisK RPC server metrics
  - job_name: 'zisk-rpc'
    static_configs:
      - targets: ['zisk-rpc:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Zcash node metrics (if available)
  - job_name: 'zcash-node'
    static_configs:
      - targets: ['zcash-node:8232']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
